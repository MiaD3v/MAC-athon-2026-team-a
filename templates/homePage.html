<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Survey - Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: lightsteelblue;
      color: #000;
    }
    /* Top Bar */
    .navbar {
      background-color: #2f4f6f;
      padding: 20px;
      text-align: center;
    }
    .navbar h1 {
      color: white;
      margin: 0;
      font-size: 32px;
    }
    /* Home Page */
    .home-container {
      max-width: 800px;
      margin: 80px auto;
      background-color: white;
      padding: 50px;
      border-radius: 30px;
      text-align: center;
    }
    h2 {
      color: #2f4f6f;
      font-size: 32px;
    }
    .description {
      font-size: 18px;
      line-height: 1.6;
    }
    /* Start Survey Button */
    .start-button {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 40px;
      background-color: #6366F1;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }
    .start-button:hover {
      background-color: #4338CA;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="navbar">
    <h1>College Survey</h1>
  </div>

  <div class="home-container">
    <h2>Welcome to the College Survey!</h2>
    <p class="description">
      bah bah bah bah bah bah bah bah 
    </p>
    <p class="description">
      Please click the button below to Satrt.
    </p>
<!-- start survey button -->
    <a href="/survey/" class="start-button">
      Start Survey
    </a>
  </div>
</body>
</html>
